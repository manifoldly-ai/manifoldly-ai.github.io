<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manifoldly</title>
  <meta name="description" content="Manifoldly Technology. Details coming soon.">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111418;
      --muted: #5b6470;
      --accent: #3b5bdb;
      --line: #e3e6ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1116;
        --fg: #eef0f3;
        --muted: #98a1ad;
        --accent: #8da2ff;
        --line: #222833;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 48px 20px;
    }
    .brand {
      font-size: 14px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 20px;
    }
    h1 {
      font-size: clamp(34px, 7vw, 56px);
      line-height: 1.1;
      margin: 0 0 20px;
      font-weight: 650;
    }
    p.lead {
      font-size: clamp(17px, 2.4vw, 20px);
      color: var(--muted);
      margin: 0 0 32px;
      max-width: 52ch;
    }
    .status {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 14px;
      color: var(--muted);
      align-self: flex-start;
    }
    footer {
      border-top: 1px solid var(--line);
      padding: 20px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <p class="brand">Manifoldly</p>
    <h1>Building something new.</h1>
    <p class="lead">Manifoldly Technology is working on AI and software products. More details coming soon.</p>
    <span class="status">Coming soon</span>
  </main>
  <footer>
    &copy; <span id="year"></span> Manifoldly Technology
  </footer>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
